# Build kontrola pri každom pushi (nasadenie beží na Verceli).
# Production deploy robí Vercel z tohto repozitára – tento workflow len overí,
# že sa projekt skompiluje (typecheck + build vrátane ikon, OCR vendoru a SW).
name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build PWA (ikony + OCR vendor + service worker)
        run: npm run build:pwa
